{% load ui %}{# Usage: include with value=4.6 count=12 #}
{% if count %}
<span class="inline-flex items-center gap-1 text-sm" title="{{ value|floatformat:1 }} out of 5 from {{ count }} review{{ count|pluralize }}">
  <svg viewBox="0 0 24 24" class="size-4 fill-amber-400 text-amber-400" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
  <span class="font-semibold text-slate-900 dark:text-white">{{ value|floatformat:1 }}</span>
  <span class="muted">({{ count }})</span>
</span>
{% else %}
<span class="badge badge-brand">{% icon "sparkles" "size-3.5" %}New</span>
{% endif %}
