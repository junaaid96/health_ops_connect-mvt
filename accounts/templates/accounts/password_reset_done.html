{% extends "layouts/auth.html" %}
{% load ui %}
{% block title %}Check your email{% endblock %}
{% block content %}
<span class="grid size-12 place-items-center rounded-2xl bg-brand-50 text-brand-700 dark:bg-brand-400/10 dark:text-brand-300">{% icon "mail-check" "size-6" %}</span>
<h1 class="mt-5 text-3xl font-bold">Check your email</h1>
<p class="mt-2 muted">If an account exists for that address, a reset link is on its way. It expires in a few days.</p>
<a href="{% url 'accounts:login' %}" class="btn btn-secondary mt-8">Back to sign in</a>
{% endblock %}
