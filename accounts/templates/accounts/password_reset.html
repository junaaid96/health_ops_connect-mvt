{% extends "layouts/auth.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold">Reset your password</h1>
<p class="mt-2 muted">Enter your account email and we'll send you a secure link.</p>
<form method="post" class="mt-8 space-y-5" novalidate>{% csrf_token %}
  {% include "components/field.html" with field=form.email %}
  <button class="btn btn-primary btn-lg w-full">Send reset link</button>
</form>
<p class="mt-8 text-center text-sm"><a href="{% url 'accounts:login' %}" class="font-semibold text-brand-700 hover:underline dark:text-brand-300">Back to sign in</a></p>
{% endblock %}
