services:
  - type: web
    name: health-ops-connect
    runtime: python
    region: singapore
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn health_ops_connect.wsgi:application --workers 3 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: SEED_DEMO
        value: "true"
